<header class="topbar" role="banner">
  <div class="left">
    <button class="icon-btn" type="button" (click)="onToggleSidebar()" aria-label="Toggle navigation width">
      <span class="hamburger" aria-hidden="true"></span>
    </button>

    <div class="brand">
      <span class="brand__title">Docs</span>
      <span class="brand__sep">/</span>
      <span class="brand__crumb">Predictive Maintenance</span>
    </div>
  </div>

  <div class="right" aria-label="Topbar actions">
    <button class="icon-btn" type="button" aria-label="Search (placeholder)">
      <span class="dot" aria-hidden="true"></span>
    </button>
    <button class="icon-btn" type="button" aria-label="Profile (placeholder)">
      <span class="dot" aria-hidden="true"></span>
    </button>
  </div>
</header>
